[project]
name = "claude-console"
version = "0.1.0"
description = "Open a visible Claude Code session on Windows and type into it, without taking focus."
requires-python = ">=3.12"
# Deliberately none. Everything here is ctypes and stdlib, which is what lets
# one copy serve both a project with its own venv and a project that shells out
# to whatever `python` is on PATH. Adding a dependency costs that.
dependencies = []

[project.scripts]
claude-console = "claude_console.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
