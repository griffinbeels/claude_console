name: Console contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m claude_console --help
      - run: python -m pytest tests/ -q
